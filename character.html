<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>キャラ詳細</title>
</head>
<body>

<h1 id="name"></h1>

<img id="image" width="300">

<p id="rarity"></p>
<p id="job"></p>

<h2>タグ</h2>

<ul id="tags"></ul>

<p>
  <a href="index.html">一覧に戻る</a>
</p>

<script>

const characters = {
  "呂布": {
    image: "https://via.placeholder.com/300",
    rarity: "MR",
    job: "武将",
    tags: ["単体火力", "PvP", "会心"]
  },

  "諸葛亮": {
    image: "https://via.placeholder.com/300",
    rarity: "MR",
    job: "謀士",
    tags: ["範囲攻撃", "知力"]
  }
};

const params = new URLSearchParams(location.search);
const name = params.get("name");

const character = characters[name];

document.getElementById("name").textContent = name;
document.getElementById("image").src = character.image;
document.getElementById("rarity").textContent =
  "レア度： " + character.rarity;

document.getElementById("job").textContent =
  "職業： " + character.job;

document.getElementById("tags").innerHTML =
  character.tags
    .map(tag => `
      <li>
        <a href="index.html" style="color:#66ccff;">
          ${tag}
        </a>
      </li>
    `)
    .join("");

</script>

</body>
</html>
