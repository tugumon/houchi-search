<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>放置少女キャラ検索</title>

<style>
body {
  background-color: #222;
  color: white;
  font-family: sans-serif;
}

a {
  color: #66ccff;
}

input {
  background-color: #333;
  color: white;
  border: 1px solid #666;
  padding: 5px;
}
</style>

</head>
<body>

<h1>放置少女キャラ検索</h1>

<input
  type="text"
  id="search"
  placeholder="キャラ名を検索"
>

<div id="list"></div>

<script>

const characters = [
  { name: "呂布" },
  { name: "諸葛亮" }
];

const list = document.getElementById("list");
const search = document.getElementById("search");

function displayCharacters(keyword = "") {

  const filtered = characters.filter(c =>
    c.name.includes(keyword)
  );

  list.innerHTML = filtered.map(c => `
    <p>
      <a href="character.html?name=${encodeURIComponent(c.name)}">
        ${c.name}
      </a>
    </p>
  `).join("");
}

search.addEventListener("input", () => {
  displayCharacters(search.value);
});

displayCharacters();

</script>

</body>
</html>
